<!-- Modal de Confirmación de Solicitud Exitosa -->
  {% load static %}
<div class="modal fade" id="modalExito" tabindex="-1" aria-labelledby="modalExitoLabel" aria-hidden="true" data-bs-backdrop="true" data-bs-keyboard="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 rounded-4">
      <div class="modal-header border-0" style="justify-content: center;">
        <img src="{% static 'imagen/ICAYS_1.png' %}" alt="Logo ICAYS" style="max-width:120px; margin:0 auto; display:block;">
      </div>
      <div class="modal-body pt-0 text-center">
        <h5 class="mb-3" id="modalExitoLabel" style="color:#000000; font-weight:600;">¡Solicitud enviada exitosamente!</h5>
        <p class="mb-3" style="color:#000000; font-size:0.98rem;">Tu solicitud fue exitosa. Prontamente se comunicará ICAYS contigo para continuar con el proceso.</p>
        <button type="button" class="btn w-100" style="background:#000000; color:#fff; border-radius:24px; font-weight:500;" onclick="window.location.href='/servicios/';">Cerrar</button>
      </div>
      <button type="button" class="btn-close position-absolute top-0 end-0 m-3" data-bs-dismiss="modal" aria-label="Cerrar"></button>
    </div>
  </div>
</div>
